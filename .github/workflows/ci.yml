# rig-enforcement CI (neutral; security and gitleaks from ditshej/rig-ci). quality is tcg-prizing's own job: no packages, PHP templates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the older run; runs on main finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `_deploy.sh` pulls `main` onto the server unchecked and there is no build
# artifact where a mistake could surface first: this check is the only net
# before going live (#22). No install step — the core runs without packages.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # same version as production
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Prettier
        run: npx --yes prettier@3 --check .
      - name: Lint PHP templates
        run: |
          find views -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l public/index.php
      - name: Tests with coverage
        run: node --test --experimental-test-coverage --test-coverage-lines=70

  security:
    uses: ditshej/rig-ci/.github/workflows/security.yml@v1
  gitleaks:
    uses: ditshej/rig-ci/.github/workflows/gitleaks.yml@v1
    permissions:
      contents: read
      pull-requests: read